[package]
name = "rules-hub"
version = "0.0.0"
description = "Hub of rules-desktop: routes, engine method list, adapters (on appkit; the read-only UI phase fills it)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "rules_hub"
path = "src/lib.rs"

[[bin]]
name = "rules-hub"
path = "src/main.rs"

[dependencies]
appkit-core.workspace = true
appkit-hub.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
appkit-testkit.workspace = true
# The folders of the tests in the temp dir (tests/common/scratch.rs), removed also after a panic.
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util"] }

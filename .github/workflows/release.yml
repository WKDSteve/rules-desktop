# A release is a deliberate act: it starts with a tag `vX.Y.Z` and ends as a DRAFT that a person
# opens, installs from and clicks through before publishing it (rule NREL-07). Nothing here
# publishes.
#
# What it makes, for the hub (the native shell and its Setup come with the Tauri task):
#   rules-hub-X.Y.Z-x86_64-pc-windows-msvc.zip   the program for Windows
#   install.ps1                                  installs exactly this release for the current user
#                                                (release-kit of appkit, stamped for this tag)
#   uninstall.ps1                                the script of scripts/ at this tag
#   SHA256SUMS                                   the checksums of all of them
#
# Runs on the maintainer's self-hosted Windows runner (by choice, see docs/RELEASING.md), so only Windows is
# built: the Linux and macOS archives and install.sh of the earlier hosted workflow are gone. Triggered only
# by a pushed tag, never by a pull request. The release-kit actions run there by Git Bash (appkit v0.23.1 and
# later). appkit is public and read without credentials.
#
# Before anything is built: the tag, the version in crates/rules-hub/Cargo.toml and the
# main branch agree, and the CI of main was green for this very commit (NREL-08). The draft, its
# files and the checksums are made by the action publish of appkit's release-kit, pinned by the
# commit of the tag that Cargo.lock pins (tools/check-appkit-pin.py checks that they agree); a
# published release is never touched again (NREL-10).
#
# Actions are pinned by commit (NREL-03); a job gets only the rights it needs.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  check:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.facts.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag, the version and the CI of this commit agree
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the tag $tag is not vX.Y.Z"; exit 1 ;;
          esac
          version="${tag#v}"
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/rules-hub/Cargo.toml | head -n 1)"
          if [ "$version" != "$crate" ]; then
            echo "::error::the tag says $version but crates/rules-hub/Cargo.toml says $crate (bump it in its own commit first)"
            exit 1
          fi
          # A release comes from main, never from a side branch.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of the tag is not on main"
            exit 1
          fi
          green="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$green" -lt 1 ]; then
            echo "::error::no green CI run for $GITHUB_SHA: wait for it, or fix main, then tag again"
            exit 1
          fi
          # A published release is never cut again: stop before anything is built.
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$draft" != "true" ]; then
            echo "::error::the release $tag is published: it is never cut again (NREL-10), make a patch release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The interface is part of the binary (NREL-04): it is built first, then the program.
      - name: Build the interface
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the program
        run: cargo build --release --locked -p rules-hub
      - name: Pack
        id: pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          name="rules-hub-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p stage dist
          cp target/release/rules-hub.exe stage/
          cp LICENSE stage/
          (cd stage && 7z a -tzip "../dist/${name}.zip" . >/dev/null)
          echo "file=dist/${name}.zip" >> "$GITHUB_OUTPUT"
      # What the archive holds, without installing it (NREL-12): unpack it elsewhere, ask the
      # program for its version (the hub is a command line program), and run the install script of
      # the release (release-kit of the appkit Cargo.lock pins) and the uninstall script on it in a
      # folder of their own.
      - name: Check the archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          set -eu
          mkdir -p check
          7z x -y "-ocheck" "$FILE" >/dev/null
          got="$(check/rules-hub.exe --version)"
          if [ "$got" != "rules-hub ${VERSION}" ]; then
            echo "::error::the program in the archive says '$got', the tag says $VERSION"
            exit 1
          fi
          pwsh -NoProfile -File scripts/test-install.ps1 target/release/rules-hub.exe
          sh scripts/test-install.sh target/release/rules-hub.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 3

  # The draft (made here when there is none), the archive, the install script stamped for this tag,
  # the uninstall script and the checksums of all of them.
  publish:
    needs: [check, build]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: WKDSteve/appkit/release-kit/publish@9f3b7ba539abf6fd92984087fe24e7e4c3bb178f # v0.29.0
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          files: dist
          expect: 1
          app: rules-desktop
          windows-kind: hub
          windows-program: rules-hub.exe
          windows-release-asset: rules-hub-{version}-{triple}.zip
          windows-rolling-asset: rules-hub-windows-x86_64.exe
          extra: |
            scripts/uninstall.ps1
          notes-file: .github/release-notes.md

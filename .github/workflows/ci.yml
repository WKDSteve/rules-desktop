# CI of rules-desktop.
#
# Runs on the maintainer's self-hosted Windows runner, by choice: the build needs the same Neovim, Chrome and
# toolchain the app is used with. Without a running runner a push stays "Queued" (no red mark, discarded after 24 h).
# Triggered only by pushes to main, never by `pull_request` or `pull_request_target`: a pull request from a fork
# could change the workflow and run its own code on that machine. Windows only: the Linux legs of the former
# workflow (tests and install scripts under sh) are gone; ShellCheck runs on the runner.
#
# The sources outside this repository (rules.nvim and lib.nvim at the pinned commits of engine.lock, appkit through
# Cargo and pnpm) are public and fetched without credentials.
# Tools (cargo, clippy, rustfmt, cargo-audit, cargo-deny, nvim, pnpm, python, Chrome) are expected on the PATH and not
# pinned here; the jobs print their versions.

name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RULES_ENGINE_DIR: ${{ github.workspace }}/engine/rules.nvim
  LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  rust:
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The pins must exist: a typo in engine.lock fails here, not later.
      - name: Fetch the pinned engine (rules.nvim) and lib.nvim
        run: |
          commit="$(sed -n 's/^commit *= *//p' engine.lock)"
          lib_commit="$(sed -n 's/^lib_commit *= *//p' engine.lock)"
          rm -rf engine
          mkdir engine
          git clone --quiet https://github.com/WKDSteve/rules.nvim engine/rules.nvim
          git -C engine/rules.nvim checkout --quiet "$commit"
          git clone --quiet https://github.com/WKDSteve/lib.nvim engine/lib.nvim
          git -C engine/lib.nvim checkout --quiet "$lib_commit"
      - run: nvim --version | head -n1 && cargo --version && pnpm --version
      # The tests answer with copies of the engine's golden documents: they must be the pinned ones.
      - name: The golden documents are those of the pinned engine
        run: |
          for f in engine/rules.nvim/schemas/rules-export/1/golden/*.json; do
            cmp "$f" "crates/rules-hub/tests/fixtures/golden/$(basename "$f")"
          done
          test "$(ls engine/rules.nvim/schemas/rules-export/1/golden/*.json | wc -l)" = \
            "$(ls crates/rules-hub/tests/fixtures/golden/*.json | wc -l)"
      # The page's types of the contract are the pinned engine's (its tests import the goldens above).
      - name: The contract types of the page are those of the pinned engine
        run: cmp engine/rules.nvim/schemas/rules-export/1/rules-export.d.ts ui/src/lib/contract.d.ts
      # The tests of the program start the engine in a real Neovim.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests of this job get a temp dir of their own, empty at the start: the shared one of the runner (the
      # author's machine) holds the leftovers of earlier runs and the folders of other jobs, so a count in it would
      # never be zero. TEMP and TMP are read on Windows, TMPDIR elsewhere. `New-Item` fails when the folder is there
      # already, so "empty at the start" is checked, not assumed.
      - name: Temp dir of this job
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "job-temp-$env:GITHUB_JOB-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          "TEMP=$dir", "TMP=$dir", "TMPDIR=$dir", "JOB_TEMP=$dir" | Add-Content -Path $env:GITHUB_ENV
      - run: cargo test --workspace --locked
      # No test left a folder in the temp dir of this job (a test makes its folder with `Scratch`, which removes it
      # also after a failure). Strict: whatever name a test gave its folder counts; `nvim` and `nvim.0` are what the
      # real Neovim of the engine tests may make itself.
      - name: The tests left nothing in the temp dir
        run: python tools/check-temp-leftovers.py --dir "$JOB_TEMP" --strict --allow nvim --allow nvim.0
      # The install script of a release (the one of appkit's release-kit that Cargo.lock pins) and the
      # uninstall scripts against this build, in folders of their own: the login entry and the link of
      # the runner are left alone, nothing is downloaded.
      - name: Install and uninstall scripts (PowerShell and sh)
        run: |
          pwsh -NoProfile -File scripts/test-install.ps1 target/debug/rules-hub.exe
          sh scripts/test-install.sh target/debug/rules-hub.exe
      # The install tests make their folders (rules-desktop-test-install-*) in the temp dir of this job too, after the
      # strict check above; test-install.ps1 fails on a folder it cannot remove, and this is the check that none stayed.
      # Not strict: the child PowerShells may leave files of their own there.
      - name: The install scripts left nothing in the temp dir
        run: python tools/check-temp-leftovers.py --dir "$JOB_TEMP"
      - name: PSScriptAnalyzer on the scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }

  # The supply chain: known advisories, licenses, sources, crate age.
  supply-chain:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (see tools/check-lock-age.py).
      - run: python tools/check-lock-age.py --min-days 7
      # appkit is the one git source: the commit Cargo.lock pins must be the one its tag names now.
      - run: python tools/check-appkit-pin.py

  ui:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in ui/pnpm-workspace.yaml. pnpm is the runner's own
      # (a global install would change this machine on every run).
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A temp dir of this job, empty at the start, as in the job rust.
      - name: Temp dir of this job
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "job-temp-$env:GITHUB_JOB-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          "TEMP=$dir", "TMP=$dir", "TMPDIR=$dir", "JOB_TEMP=$dir" | Add-Content -Path $env:GITHUB_ENV
      - run: pnpm test
      # Not strict: Node and vitest may keep caches of their own in the temp dir; the folders of the tests count.
      # This job's own defaults leave the shell to the runner (PowerShell), so it is named and the variable read its way.
      - name: The tests left nothing in the temp dir
        shell: pwsh
        run: python ../tools/check-temp-leftovers.py --dir "$env:JOB_TEMP"
      - run: pnpm build
      - run: pnpm audit --audit-level high

  # The browser tests: the binary, the real engine (a real Neovim and the pinned rules.nvim), the system's Chrome,
  # axe on every view in both colour schemes, and a corpus of hostile rules.
  e2e:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - name: Fetch the pinned engine (rules.nvim) and lib.nvim
        run: |
          commit="$(sed -n 's/^commit *= *//p' engine.lock)"
          lib_commit="$(sed -n 's/^lib_commit *= *//p' engine.lock)"
          rm -rf engine
          mkdir engine
          git clone --quiet https://github.com/WKDSteve/rules.nvim engine/rules.nvim
          git -C engine/rules.nvim checkout --quiet "$commit"
          git clone --quiet https://github.com/WKDSteve/lib.nvim engine/lib.nvim
          git -C engine/lib.nvim checkout --quiet "$lib_commit"
      - name: Build the page, then the binary that embeds it
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
          cargo build --locked
      # A temp dir of this job, empty at the start, as in the job rust.
      - name: Temp dir of this job
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "job-temp-$env:GITHUB_JOB-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          "TEMP=$dir", "TMP=$dir", "TMPDIR=$dir", "JOB_TEMP=$dir" | Add-Content -Path $env:GITHUB_ENV
      - name: Browser tests (Playwright, axe, hostile rules)
        working-directory: ui
        run: pnpm e2e
      # The hub's folder and the state file of the run are gone (ui/e2e/cleanup.ts). Not strict: Chrome and
      # Playwright keep caches of their own in the temp dir.
      - name: The browser tests left nothing in the temp dir
        run: python tools/check-temp-leftovers.py --dir "$JOB_TEMP"
      # A failed browser test leaves its trace (network, DOM, console) to read instead of a guess.
      - name: Traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: playwright-traces
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 14

  # A control or invisible character in a tracked text file is refused; the tool tests itself.
  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python -m unittest discover tools
      - run: python tools/check-control-chars.py
      # A colour the CSS of the page states is a token of appkit-ui (the same check runs in appkit).
      - run: python tools/check-color-literals.py --root ui/src --tokens ui/src/palette.css
      # The shell scripts of the repository (NREL-16): ShellCheck is on the runner (`scoop install shellcheck`).
      - run: shellcheck scripts/*.sh

[workspace]
resolver = "3"
members = ["crates/rules-hub"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/WKDSteve/rules-desktop"

# The kit both apps are built on, pinned by its tag; the page takes appkit-ui from the same tag
# (ui/package.json). tools/check-appkit-pin.py checks that the tag still names the commit in Cargo.lock
# and ui/pnpm-lock.yaml.
[workspace.dependencies]
appkit-core = { git = "https://github.com/WKDSteve/appkit", tag = "v0.27.0" }
appkit-hub = { git = "https://github.com/WKDSteve/appkit", tag = "v0.27.0" }
appkit-testkit = { git = "https://github.com/WKDSteve/appkit", tag = "v0.27.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The program `rules-hub install` copies: small and quick to start.
[profile.release]
lto = "thin"
strip = true
